<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Skills</title>

    <link rel="stylesheet" href="search.css">
</head>

<body>

    <div class="container">

        <h1>🔍 Search Skills</h1>

        <p class="subtitle">
            Find people who can help you learn new skills
        </p>

        <div class="search-box">

            <input type="text" placeholder="Search Skill (Java, PHP, React...)">

            <button>Search</button>

        </div>

        <div class="results">

            <div class="card">

                <h2>👨 Rahul Sharma</h2>

                <p><strong>Skill:</strong> Java</p>

                <p><strong>Level:</strong> Advanced ⭐</p>

                <p><strong>Rating:</strong> ⭐ 4.9</p>

                <p><strong>Match:</strong> 95%</p>

                <button class="request-btn">
                    Send Request
                </button>

            </div>

            <div class="card">

                <h2>👩 Priya Verma</h2>

                <p><strong>Skill:</strong> React JS</p>

                <p><strong>Level:</strong> Intermediate ⭐</p>

                <p><strong>Rating:</strong> ⭐ 4.8</p>

                <p><strong>Match:</strong> 90%</p>

                <button class="request-btn">
                    Send Request
                </button>

            </div>

            <div class="card">

                <h2>👨 Aman Gupta</h2>

                <p><strong>Skill:</strong> PHP</p>

                <p><strong>Level:</strong> Advanced ⭐</p>

                <p><strong>Rating:</strong> ⭐ 4.7</p>

                <p><strong>Match:</strong> 88%</p>

                <button class="request-btn">
                    Send Request
                </button>

            </div>

        </div>

    </div>

</body>

</html>
