<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Skill Exchange Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Skill Network Background Layer */
        .skill-network {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }
        .skill-badge {
            position: absolute;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 50px;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: floatSkill 12s infinite alternate ease-in-out;
        }
        .sb1 { top: 12%; left: 8%; animation-delay: 0s; }
        .sb2 { top: 75%; left: 12%; animation-delay: 2s; }
        .sb3 { top: 20%; right: 10%; animation-delay: 4s; }
        .sb4 { top: 70%; right: 8%; animation-delay: 1s; }
        .sb5 { top: 45%; left: 18%; animation-delay: 3s; }
        .sb6 { top: 40%; right: 15%; animation-delay: 5s; }

        @keyframes floatSkill {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-40px) rotate(5deg); background: rgba(99, 102, 241, 0.15); border-color: rgba(99, 102, 241, 0.4); }
        }

        /* Glassmorphic Container Box */
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            z-index: 2;
        }
        h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 5px;
            font-weight: 800;
            font-size: 26px;
            letter-spacing: -0.5px;
        }
        .tagline {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        .tagline span {
            color: #38bdf8;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            margin: 10px 0;
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 14px;
            box-sizing: border-box;
            font-size: 14px;
            color: #f8fafc;
            outline: none;
            transition: all 0.3s ease;
        }
        input::placeholder {
            color: #64748b;
        }
        input:focus {
            border-color: #6366f1;
            background: #0f172a;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            margin: 2px 0 15px 2px;
        }
        .checkbox-container input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
            accent-color: #6366f1;
        }
        .checkbox-container label {
            font-size: 13px;
            color: #94a3b8;
            cursor: pointer;
        }
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 18px rgba(99, 102, 241, 0.4);
            transition: all 0.2s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(99, 102, 241, 0.5);
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #94a3b8;
        }
        .register-link a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="skill-network">
        <div class="skill-badge sb1">💻 Python & Java</div>
        <div class="skill-badge sb2">🎨 UI/UX Design</div>
        <div class="skill-badge sb3">📈 Digital Marketing</div>
        <div class="skill-badge sb4">🗣️ Public Speaking</div>
        <div class="skill-badge sb5">🎬 Video Editing</div>
        <div class="skill-badge sb6">📝 Content Writing</div>
    </div>

    <div class="container">
        <h2>Welcome Back</h2>
        <p class="tagline">Log in to exchange your <span>Skills</span></p>
        
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>
            
            <div class="checkbox-container">
                <input type="checkbox" id="showPasswordToggle">
                <label for="showPasswordToggle">Show Password</label>
            </div>
            
            <button type="submit" class="btn">Sign In</button>
        </form>

        <p class="register-link">
            New to the Hub? 
            <a href="register.html">Create an Account</a>
        </p>
    </div>

    <script>
        const form = document.getElementById("loginForm");
        const passwordInput = document.getElementById("password");
        const showPasswordToggle = document.getElementById("showPasswordToggle");

        showPasswordToggle.addEventListener("change", function() {
            passwordInput.type = this.checked ? "text" : "password";
        });

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = passwordInput.value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                
                if (data.success) {
                    // HERE IS THE MAGIC: Saving user data in browser pocket memory
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    alert(`Welcome back, ${data.user.name}!`);
                    window.location.href = "dashboard.html"; // Redirecting to Dashboard
                } else {
                    alert(data.message);
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Failed to connect to the server. Please try again.");
            }
        });
    </script>
</body>
</html>
